<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alignment Through Games</title>
  <meta name="description" content="A learning path on how AI agents learn rules and goals, and on the alignment control problem, taught through games.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l3.2 10.8L30 16l-10.8 3.2L16 30l-3.2-10.8L2 16l10.8-3.2z' fill='%23d97706'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      const saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (_) { /* storage unavailable: fall back to system theme */ }
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#top">
        <svg class="brand-star" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l3.2 10.8L30 16l-10.8 3.2L16 30l-3.2-10.8L2 16l10.8-3.2z"/></svg>
        <span>Alignment Through Games</span>
      </a>
      <nav class="nav" aria-label="Sections">
        <a href="#roadmap">Roadmap</a>
        <a href="#modules">Modules</a>
        <a href="#library">Library</a>
        <button class="theme-toggle" type="button" aria-label="Toggle color theme">◐</button>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero wrap">
      <h1 data-bind="title"></h1>
      <p class="focus" data-bind="focus"></p>
      <ol class="arc" id="arc" aria-label="The arc of the path"></ol>
    </section>

    <section class="wrap section" id="roadmap" aria-labelledby="roadmap-h">
      <h2 id="roadmap-h">Roadmap</h2>
      <ol class="roadmap" id="roadmap-list"></ol>
    </section>

    <section class="wrap section" id="modules" aria-labelledby="modules-h">
      <div class="section-head">
        <h2 id="modules-h">Modules</h2>
        <button class="text-btn" type="button" id="toggle-all">Expand all</button>
      </div>
      <div id="module-list"></div>
    </section>

    <section class="wrap section" id="library" aria-labelledby="library-h">
      <h2 id="library-h">Library</h2>
      <div class="filters" id="filters" role="group" aria-label="Filter by type"></div>
      <div class="pgrid" id="library-grid"></div>
    </section>
  </main>

  <footer class="wrap footer">
    <p>Sources checked <span data-bind="checked"></span> · <a data-bind-href="repo">GitHub</a></p>
  </footer>
  <noscript><p class="wrap">This page renders its content with JavaScript. See curriculum.json in the repository for the raw outline.</p></noscript>
</body>
</html>
